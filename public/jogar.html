<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogando</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        .voltar { position: fixed; top: 10px; left: 10px; background: #ff9800; color: #000; padding: 8px 12px; border-radius: 5px; text-decoration: none; font-weight: bold; z-index: 999; }
    </style>
</head>
<body>

    <a href="home.html" class="voltar">← Voltar</a>

    <!-- O iframe vai carregar o jogo real dentro do seu site -->
    <iframe id="iframeJogo" src=""></iframe>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const linkDoJogo = parametros.get('url');

        if (linkDoJogo) {
            document.getElementById('iframeJogo').src = linkDoJogo;
        } else {
            alert("Link do jogo não encontrado!");
            window.location.href = 'home.html';
        }
    </script>

</body>
</html>
