<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogando</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #121212; overflow: hidden; font-family: Arial, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; position: relative; z-index: 2; }
        .voltar { position: fixed; top: 10px; left: 10px; background: #ff9800; color: #000; padding: 8px 14px; border-radius: 5px; text-decoration: none; font-weight: bold; z-index: 999; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; z-index: 1; text-align: center; }
    </style>
</head>
<body>

    <a href="home.html" class="voltar">← Voltar</a>
    
    <div class="loading" id="textoCarregando">Carregando o jogo, por favor aguarde...</div>

    <iframe id="iframeJogo" src="" onload="document.getElementById('textoCarregando').style.display='none';"></iframe>

    <script>
        const parametros = new URLSearchParams(window.location.search);
        const linkDoJogo = parametros.get('url');

        if (linkDoJogo) {
            document.getElementById('iframeJogo').src = linkDoJogo;
        } else {
            alert("Link do jogo não encontrado!");
            window.location.href = 'home.html';
        }
    </script>

</body>
</html>
