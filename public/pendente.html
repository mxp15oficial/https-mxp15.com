<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mxp$15 - Histórico e Pendentes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { 
            --bg: #0b0e14; 
            --card: #161b22; 
            --accent: #007bff; 
            --text: #fff; 
            --text-muted: #8b949e; 
            --gold: #ffcc00; 
            --verde: #2ea043;
            --vermelho: #f85149;
        }
        body { background-color: var(--bg); color: var(--text); font-family: sans-serif; padding: 15px; margin: 0; padding-bottom: 80px; }
        
        /* Navegação Superior */
        .header-nav { display: flex; gap: 20px; font-size: 0.95em; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 15px; color: var(--text-muted); overflow-x: auto; white-space: nowrap; z-index: 9999; position: relative; }
        .header-nav span { cursor: pointer; }
        .header-nav span.ativo { color: var(--accent); font-weight: bold; border-bottom: 2px solid var(--accent); padding-bottom: 8px; }

        /* Resumo / Contador de Depósito */
        .painel-resumo { background: var(--card); border: 1px solid #30363d; border-radius: 12px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .painel-resumo h3 { margin: 0 0 5px 0; font-size: 0.9em; color: var(--text-muted); }
        .painel-resumo .valor-total { font-size: 1.4em; font-weight: bold; color: var(--gold); }

        /* Seção de Recompensas Perdidas / Expiradas (Oculta por padrão se não houver saldo) */
        .bloco-perdidas { background: linear-gradient(135deg, #2b1d0c, #161b22); border: 1px solid var(--gold); border-radius: 12px; padding: 15px; margin-bottom: 20px; display: none; justify-content: space-between; align-items: center; }
        .bloco-perdidas-info p { margin: 0 0 5px 0; font-size: 0.85em; color: var(--text-muted); }
        .bloco-perdidas-info h4 { margin: 0; font-size: 1.2em; color: var(--gold); }
        .btn-resgatar-tudo { background: var(--gold); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9em; }

        /* Barra de Pesquisa e Filtros de Data */
        .filtros-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .search-box { width: 100%; }
        .search-box input { width: 100%; padding: 10px 15px; border-radius: 8px; border: 1px solid #30363d; background: var(--card); color: #fff; font-size: 14px; box-sizing: border-box; }
        
        .botoes-datas { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .botoes-datas::-webkit-scrollbar { display: none; }
        .btn-data { flex: 0 0 auto; background: var(--card); border: 1px solid #30363d; color: var(--text-muted); padding: 8px 14px; border-radius: 20px; font-size: 0.8em; cursor: pointer; }
        .btn-data.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold; }

        /* Lista de Comprovantes/Transações */
        .lista-transacoes { display: flex; flex-direction: column; gap: 10px; }
        .card-transacao { background: var(--card); border: 1px solid #30363d; border-radius: 10px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        
        .transacao-info { display: flex; align-items: center; gap: 12px; }
        .transacao-icone { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1em; }
        
        /* Cores dos ícones baseados no tipo */
        .card-transacao.deposito .transacao-icone { background: rgba(248, 81, 73, 0.15); color: var(--vermelho); border: 1px solid var(--vermelho); }
        .card-transacao.saque .transacao-icone { background: rgba(46, 160, 67, 0.15); color: var(--verde); border: 1px solid var(--verde); }

        .transacao-detalhes h4 { margin: 0 0 4px 0; font-size: 0.95em; color: var(--text); }
        .transacao-detalhes span { font-size: 0.75em; color: var(--text-muted); }

        .transacao-valor { font-weight: bold; font-size: 1em; }
        .card-transacao.deposito .transacao-valor { color: var(--vermelho); }
        .card-transacao.saque .transacao-valor { color: var(--verde); }

        .sem-registros { text-align: center; color: var(--text-muted); padding: 30px; font-size: 0.9em; }
    </style>
</head>
<body>

    <!-- Navegação Superior -->
    <div class="header-nav">
        <span onclick="window.location.href='promocao.html'">Eventos</span>
        <span onclick="window.location.href='rebate.html'">Rebate</span>
        <span onclick="window.location.href='vip.html'">VIP</span>
        <span onclick="window.location.href='resgate.html'">Código de Resgate</span>
        <span class="ativo">Pendente / Histórico</span>
    </div>

    <!-- Painel de Resumo (Contador de Depósitos) -->
    <div class="painel-resumo">
        <div>
            <h3>Total Depositado (Filtro Atual)</h3>
            <span class="valor-total" id="totalDepPeriodo">R$ 0,00</span>
        </div>
        <div style="text-align: right;">
            <h3>Transações</h3>
            <span id="qtdTransacoes" style="font-weight: bold; font-size: 1.1em;">0</span>
        </div>
    </div>

    <!-- Bloco de Recompensas Perdidas / Não Coletadas (SÓ APARECE SE HOUVER VALOR > 0) -->
    <div class="bloco-perdidas" id="blocoPerdidasContainer">
        <div class="bloco-perdidas-info">
            <p>Recompensas não coletadas / expiradas:</p>
            <h4 id="valorPerdidasTexto">R$ 0,00</h4>
        </div>
        <button class="btn-resgatar-tudo" onclick="resgatarTudoPerdidas()">Resgatar Tudo</button>
    </div>

    <!-- Filtros e Barra de Pesquisa -->
    <div class="filtros-container">
        <div class="search-box">
            <input type="text" id="inputPesquisa" placeholder="Pesquisar por ID, valor ou tipo..." onkeyup="filtrarTransacoes()">
        </div>
        
        <div class="botoes-datas">
            <button class="btn-data active" onclick="mudarFiltroData('hoje', this)">Hoje</button>
            <button class="btn-data" onclick="mudarFiltroData('ontem', this)">Ontem</button>
            <button class="btn-data" onclick="mudarFiltroData('3dias', this)">3 dias</button>
            <button class="btn-data" onclick="mudarFiltroData('7dias', this)">7 dias</button>
            <button class="btn-data" onclick="mudarFiltroData('15dias', this)">15 dias</button>
            <button class="btn-data" onclick="mudarFiltroData('30dias', this)">30 dias</button>
            <button class="btn-data" onclick="mudarFiltroData('tudo', this)">Mostrar Tudo</button>
        </div>
    </div>

    <!-- Lista de Comprovantes Pix -->
    <div class="lista-transacoes" id="containerTransacoes">
        <!-- Preenchido via Script -->
    </div>

    <script>
        // Transações de exemplo
        let transacoes = JSON.parse(localStorage.getItem('mxp15_transacoes')) || [
            { tipo: 'deposito', valor: 150.00, data: new Date().toISOString(), desc: 'Pix Depósito - Aprovado' },
            { tipo: 'saque', valor: 80.00, data: new Date(Date.now() - 86400000).toISOString(), desc: 'Pix Saque - Realizado' }
        ];

        // Se quiser testar com recompensa, mude o valor abaixo no localStorage ou coloque > 0
        // Definido como 0 por padrão para a firma ficar protegida!
        let recompensasPerdidas = parseFloat(localStorage.getItem('mxp15_perdidas')) || 0.00; 

        let filtroAtualData = 'hoje';

        function carregarDados() {
            const blocoContainer = document.getElementById('blocoPerdidasContainer');
            
            // SEGURANÇA DA FIRMA: Só exibe o bloco se houver saldo real pendente (> 0)
            if (recompensasPerdidas > 0) {
                document.getElementById('valorPerdidasTexto').innerText = `R$ ${recompensasPerdidas.toFixed(2)}`;
                blocoContainer.style.display = 'flex';
            } else {
                blocoContainer.style.display = 'none';
            }

            renderizarLista();
        }

        function mudarFiltroData(filtro, elemento) {
            filtroAtualData = filtro;
            document.querySelectorAll('.btn-data').forEach(b => b.classList.remove('active'));
            elemento.classList.add('active');
            renderizarLista();
        }

        function filtrarTransacoes() {
            renderizarLista();
        }

        function renderizarLista() {
            const container = document.getElementById('containerTransacoes');
            const termoBusca = document.getElementById('inputPesquisa').value.toLowerCase();
            container.innerHTML = '';

            const agora = new Date();
            let listaFiltrada = transacoes.filter(t => {
                let dataTransacao = new Date(t.data);
                let diffDias = (agora - dataTransacao) / (1000 * 60 * 60 * 24);

                let passaData = true;
                if (filtroAtualData === 'hoje') passaData = diffDias < 1;
                else if (filtroAtualData === 'ontem') passaData = diffDias >= 1 && diffDias < 2;
                else if (filtroAtualData === '3dias') passaData = diffDias <= 3;
                else if (filtroAtualData === '7dias') passaData = diffDias <= 7;
                else if (filtroAtualData === '15dias') passaData = diffDias <= 15;
                else if (filtroAtualData === '30dias') passaData = diffDias <= 30;
                else if (filtroAtualData === 'tudo') passaData = true;

                let passaBusca = t.desc.toLowerCase().includes(termoBusca) || t.valor.toString().includes(termoBusca) || t.tipo.includes(termoBusca);

                return passaData && passaBusca;
            });

            let totalDepositadoPeriodo = 0;

            if (listaFiltrada.length === 0) {
                container.innerHTML = `<div class="sem-registros">Nenhum registro encontrado para este período.</div>`;
            } else {
                listaFiltrada.forEach(t => {
                    if (t.tipo === 'deposito') {
                        totalDepositadoPeriodo += t.valor;
                    }

                    let iconeClass = t.tipo === 'deposito' ? 'fa-arrow-down' : 'fa-arrow-up';
                    let sinal = t.tipo === 'deposito' ? '-' : '+';
                    let dataFormatada = new Date(t.data).toLocaleDateString('pt-BR') + ' ' + new Date(t.data).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'});

                    container.innerHTML += `
                        <div class="card-transacao ${t.tipo}">
                            <div class="transacao-info">
                                <div class="transacao-icone">
                                    <i class="fa-solid ${iconeClass}"></i>
                                </div>
                                <div class="transacao-detalhes">
                                    <h4>${t.desc}</h4>
                                    <span>${dataFormatada}</span>
                                </div>
                            </div>
                            <div class="transacao-valor">
                                ${sinal} R$ ${t.valor.toFixed(2)}
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('totalDepPeriodo').innerText = `R$ ${totalDepositadoPeriodo.toFixed(2)}`;
            document.getElementById('qtdTransacoes').innerText = listaFiltrada.length;
        }

        function resgatarTudoPerdidas() {
            if (recompensasPerdidas <= 0) {
                alert("Operação negada: Nenhuma recompensa pendente.");
                return;
            }

            alert(`Sucesso! R$ ${recompensasPerdidas.toFixed(2)} resgatados para a sua conta.`);
            
            recompensasPerdidas = 0;
            localStorage.setItem('mxp15_perdidas', '0');
            
            // Oculta imediatamente o bloco após o resgate
            document.getElementById('blocoPerdidasContainer').style.display = 'none';
        }

        window.onload = function() {
            carregarDados();
        };
    </script>
</body>
</html>
