<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - Jogos</title>
    <link rel="stylesheet" href="estilos.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 15px; text-align: center; }
        h1 { font-size: 20px; color: #fff; margin-bottom: 10px; }
        .topo-painel { background: #1e1e1e; padding: 12px; border-radius: 8px; max-width: 500px; margin: 0 auto 20px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.3); display: flex; justify-content: space-around; align-items: center; flex-wrap: wrap; gap: 8px; border: 1px solid #333; }
        .saldo-box { font-size: 16px; font-weight: bold; color: #28a745; width: 100%; }
        .btn-acao { background-color: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; font-size: 14px; }
        .btn-acao:hover { background-color: #0056b3; }
        .btn-bau { background-color: #ffc107; color: #000; }
        
        /* Filtros de Provedores */
        .filtros-provedores { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; justify-content: center; margin-bottom: 15px; }
        .filtro-btn { background: #222; color: #aaa; border: 1px solid #444; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .filtro-btn.ativo { background: #28a745; color: #fff; border-color: #28a745; }

        /* Grid de Jogos */
        #container-jogos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 500px; margin: 0 auto; }
        @media(min-width: 600px) { #container-jogos { grid-template-columns: repeat(3, 1fr); } }

        .card-jogo { background: #1e1e1e; border: 1px solid #333; padding: 12px; border-radius: 10px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
        .card-jogo h3 { font-size: 14px; margin: 0 0 4px 0; color: #fff; }
        .card-jogo p { font-size: 11px; color: #aaa; margin: 0 0 8px 0; }
        .btn-jogar { background-color: #ff9800; color: #000; border: none; padding: 6px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-jogar:hover { background-color: #e08600; }
        .btn-sair { background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-top: 25px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Plataforma de Jogos</h1>
    
    <!-- Painel do Usuário -->
    <div class="topo-painel">
        <div class="saldo-box">Saldo: R$ <span id="visorSaldo">0.00</span></div>
        <a href="deposito.html" class="btn-acao">Depositar</a>
        <a href="bau.html" class="btn-acao btn-bau">🎁 Baú</a>
    </div>

    <!-- Filtros por Provedor -->
    <div class="filtros-provedores">
        <button class="filtro-btn ativo" onclick="filtrarProvedor('Todos', this)">Todos</button>
        <button class="filtro-btn" onclick="filtrarProvedor('PG Soft', this)">PG Soft</button>
        <button class="filtro-btn" onclick="filtrarProvedor('TaDa', this)">TaDa</button>
        <button class="filtro-btn" onclick="filtrarProvedor('BGBits', this)">BGBits</button>
    </div>

    <!-- Lista de Jogos Carregados do GitHub -->
    <div id="container-jogos">Carregando jogos...</div>

    <button class="btn-sair" onclick="localStorage.removeItem('usuario'); window.location.href='index.html';">Sair (Logout)</button>

    <script>
        let listaGlobalJogos = [];

        window.onload = function() {
            let saldoSalvo = localStorage.getItem("saldo_teste") || "0.00";
            document.getElementById("visorSaldo").innerText = parseFloat(saldoSalvo).toFixed(2);
            carregarJogos();
        };

        const urlGitHub = "https://raw.githubusercontent.com/mxp15oficial/https-mxp15.com/refs/heads/main/public/jogos.json";

        async function carregarJogos() {
            try {
                let resposta = await fetch(urlGitHub);
                listaGlobalJogos = await resposta.json();
                exibirJogos(listaGlobalJogos);
            } catch (erro) {
                document.getElementById("container-jogos").innerHTML = "<p style='grid-column: span 2; color:red;'>Erro ao carregar os jogos do GitHub.</p>";
            }
        }

        function exibirJogos(jogos) {
            let htmlJogos = "";
            jogos.forEach(j => {
                htmlJogos += `
                    <div class="card-jogo">
                        <div>
                            <h3>${j.jogo}</h3>
                            <p>Provedor: ${j.provedor}</p>
                        </div>
                        <button class="btn-jogar" onclick="window.location.href='jogar.html?url=${encodeURIComponent(j.url)}'">JOGAR</button>
                    </div>
                `;
            });
            document.getElementById("container-jogos").innerHTML = htmlJogos;
        }

        function filtrarProvedor(provedor, elemento) {
            // Remove a classe ativo de todos os botões
            document.querySelectorAll('.filtro-btn').forEach(btn => btn.classList.remove('ativo'));
            elemento.classList.add('ativo');

            if (provedor === 'Todos') {
                exibirJogos(listaGlobalJogos);
            } else {
                let filtrados = listaGlobalJogos.filter(j => j.provedor === provedor);
                exibirJogos(filtrados);
            }
        }
    </script>

</body>
</html>
