<!DOCTYPE html>
<html lang="pt-BR">

  <link rel="stylesheet" href="styles.css">
  <style>
    .categorias { display: flex; overflow-x: auto; gap: 10px; padding: 10px 15px; white-space: nowrap; scrollbar-width: none; }
    .categorias::-webkit-scrollbar { display: none; }
    .categorias button { flex: 0 0 auto; padding: 8px 16px; border-radius: 20px; border: none; background: #1e1e2f; color: #fff; cursor: pointer; font-weight: bold; }
    .categorias button.active { background: #e6af2e; color: #000; }
    .search-box { padding: 0 15px; margin: 10px 0; }
    .search-box input { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid #333; background: #181824; color: #fff; font-size: 14px; }
    .games-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 10px; }
    .game-card { background: #181824; border-radius: 12px; overflow: hidden; text-align: center; display: none; position: relative; cursor: pointer; aspect-ratio: 1/1; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .game-card.visible { display: block; }
    .game-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
    .game-card:hover img { transform: scale(1.05); }
    .btn-mostrar-mais { display: block; width: 90%; margin: 15px auto; padding: 10px; background: #22223b; color: #e6af2e; border: 1px solid #e6af2e; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; }
    .live-winner-bar { background: linear-gradient(90deg, #181824, #2a2a40, #181824); border-top: 1px solid #e6af2e33; border-bottom: 1px solid #e6af2e33; color: #fff; padding: 8px 15px; font-size: 12px; display: flex; align-items: center; gap: 10px; overflow: hidden; white-space: nowrap; margin-bottom: 10px; }
    .live-winner-bar .badge { background: #e6af2e; color: #000; font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 10px; text-transform: uppercase; }
    .menu-bottom { position: fixed; bottom: 0; left: 0; width: 100%; background: #12121a; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #22223b; z-index: 1000; }
    .menu-bottom a { color: #888; text-decoration: none; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .menu-bottom a.active { color: #e6af2e; }
    body { padding-bottom: 70px; background-color: #0b0b10; color: #fff; font-family: sans-serif; margin: 0; }
    header.topo { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #12121a; }
    header.topo .logo { font-weight: bold; font-size: 18px; color: #e6af2e; }
    header.topo .saldo { background: #181824; padding: 5px 10px; border-radius: 8px; font-size: 14px; color: #e6af2e; }
    .acoes { display: flex; gap: 10px; padding: 0 15px; margin-bottom: 10px; }
    .acoes button { flex: 1; padding: 10px; border-radius: 8px; border: none; background: #1e1e2f; color: #fff; font-weight: bold; cursor: pointer; }
  </style>
</head>

  <script>
    let categoriaAtual = 'popular'; 
    let expandido = false;
    const players = ["Carlos_99", "Ana_Silva", "Lucas_Bet", "MarianaX"];
    
    function gerarNoticiaAoVivo() {
      const player = players[Math.floor(Math.random() * players.length)];
      const tickerElement = document.getElementById('liveWinnerTicker');
      if (tickerElement) tickerElement.innerText = `🎉 ${player} ganhou R$ 235,48 agora mesmo!`;
    }

    window.addEventListener('DOMContentLoaded', () => {
      gerarNoticiaAoVivo();
      setInterval(gerarNoticiaAoVivo, 3500);
      atualizarExibicaoJogos();
    });

    function filtrarCategoria(cat, elemento) {
      categoriaAtual = cat; 
      expandido = false;
      document.getElementById('btnExpandir').innerText = "Mostrar Tudo ▼";
      document.querySelectorAll('.categorias button').forEach(b => b.classList.remove('active'));
      elemento.classList.add('active');
      atualizarExibicaoJogos();
    }

    function atualizarExibicaoJogos() {
      const cards = document.querySelectorAll('#gridJogos .game-card');
      let visiveisContador = 0;
      cards.forEach(card => {
        const catCard = card.getAttribute('data-cat');
        if (catCard && catCard.includes(categoriaAtual)) {
          if (expandido || visiveisContador < 4) { card.classList.add('visible'); visiveisContador++; }
          else { card.classList.remove('visible'); }
        } else { card.classList.remove('visible'); }
      });
      document.getElementById('btnExpandir').style.display = (document.querySelectorAll('.game-card').length > 4) ? 'block' : 'none';
    }

    function alternarExpandir() {
      expandido = !expandido;
      document.getElementById('btnExpandir').innerText = expandido ? "Recolher ▲" : "Mostrar Tudo ▼";
      atualizarExibicaoJogos();
    }

    function pesquisarJogos() {
      const termo = document.getElementById('inputBusca').value.toLowerCase();
      const cards = document.querySelectorAll('#gridJogos .game-card');
      if (termo === "") { atualizarExibicaoJogos(); return; }
      cards.forEach(card => { card.classList.toggle('visible', card.getAttribute('data-nome').includes(termo)); });
      document.getElementById('btnExpandir').style.display = 'none';
    }
  </script>
