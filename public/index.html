<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos.css">
    
    <script>
    let usuarioLogado = localStorage.getItem("usuario");
    if (usuarioLogado) {
        window.location.href = "home.html";
    }
    </script>
</head>

<body>

    <div class="login-box">
        <img src="4085.jpg" width="151" alt="Logo">
        <h1>Login</h1>
        <br>

        <form id="formLogin">
            <input type="text" id="loginUsuario" placeholder="Usuário ou e-mail" required>
            <br><br>
            <input type="password" id="loginSenha" placeholder="Senha" required>
            <br><br>
            <button type="submit">Entrar</button>
        </form>

        <br><br>

        <!-- Botão de cadastro corrigido para apontar para a página correta ou de cadastro -->
        <button onclick="window.location.href = 'cadastro.html';">
            Cadastrar
        </button>
    </div>

    <script>
    document.getElementById("formLogin").addEventListener("submit", function(e) {
        e.preventDefault();

        let usuarioDigitado = document.getElementById("loginUsuario").value.trim();
        let senhaDigitada = document.getElementById("loginSenha").value;

        let usuarioSalvo = localStorage.getItem("usuario");
        let senhaSalva = localStorage.getItem("senha");

        if (usuarioDigitado === usuarioSalvo && senhaDigitada === senhaSalva && usuarioSalvo !== null) {
            alert("Login efetuado com sucesso!");
            window.location.href = "home.html";
        } else {
            alert("Usuário ou senha incorretos! Se não tiver conta, clique em Cadastrar.");
        }
    });
    </script>

</body>
</html>
